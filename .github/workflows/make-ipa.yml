name: Generate IPA Output

on:
  workflow_dispatch:  # This allows you to manually trigger it via the GitHub webpage

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout project files
        uses: actions/checkout@v5

      - name: Setup xtool Engine
        run: |
          brew install xtool-org/tap/xtool
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Verify xtool Installation
        run: xtool --version

      - name: Compile and Export IPA Bundle
        run: |
          xtool dev build --ipa

      - name: Find generated IPA
        shell: bash
        run: |
          IPA_PATH="$(find . -type f -name '*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "No .ipa file was generated by xtool."
            exit 1
          fi
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          echo "Generated IPA: $IPA_PATH"

      - name: Upload File Bundle Artifact
        uses: actions/upload-artifact@v5
        with:
          name: TimeSecondsDisplayer-Build
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
