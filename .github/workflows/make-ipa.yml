name: Generate IPA Output

on:
  workflow_dispatch:  # This allows you to manually trigger it via the GitHub webpage

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout project files
        uses: actions/checkout@v4

      - name: Setup xtool Engine
        run: |
          # Downloads the raw installation script directly to avoid HTML errors
          curl -fL https://githubusercontent.com -o install.sh
          chmod +x install.sh
          ./install.sh
          echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Verify xtool Installation
        run: xtool --version

      - name: Compile and Export IPA Bundle
        run: |
          xtool dev build --ipa

      - name: Upload File Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimeSecondsDisplayer-Build
          path: build/*.ipa
