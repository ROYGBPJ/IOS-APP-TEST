name: iOS Build Pipeline
on:
  push:
    branches: [ main ]
  pull_request: branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- START OF AFTER-ACTIONS FOR IPA CONVERSION ---
      
      - name: Install xtool
        run: |
          curl -fL https://github.com -o xtool
          chmod +x xtool
          sudo mv xtool /usr/local/bin/
          echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Verify xtool Installation
        run: xtool --version

      # This triggers the automatic conversion and bundling into an IPA binary
      # since your project files are situated right at the root directory
       Alb-Compile iOS IPA Build Binary
        run: |
          xtool dev build --ipa

      - name: Upload IPA Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TimeSecondsDisplayer-Build
          path: build/*.ipa
